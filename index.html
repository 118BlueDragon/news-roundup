<script id="trade-alert-confirmation">
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  const id = params.get("alert") || "";
  const topic = params.get("topic") || "";
  const feedback = params.get("feedback") || "";
  const replykey = params.get("replykey") || "";
  if (!/^[A-Za-z0-9_-]{8,96}$/.test(id) || !/^[A-Za-z0-9_-]{1,96}$/.test(topic) ||
      !/^https:\/\/[A-Za-z0-9.-]+$/.test(feedback) || !/^[A-Za-z0-9_-]{40,48}$/.test(replykey)) return;
  const labels = {BOUGHT: "已买", SOLD: "已卖"};
  const verbs = [...new Set((params.get("actions") || "").split(",").filter(v => Object.prototype.hasOwnProperty.call(labels, v)))];
  const initial = params.get("act");
  const code = params.get("symbol") || "";
  const today = new Intl.DateTimeFormat("sv-SE", {timeZone:"Asia/Shanghai",
    year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date());
  const panel = document.createElement("dialog");
  panel.setAttribute("aria-labelledby", "stock-confirm-title");
  panel.style.cssText = "box-sizing:border-box;width:min(94vw,420px);max-height:94vh;padding:20px;border:1px solid #777;border-radius:12px;color:#171717;background:#fafafa;text-align:left;font:16px/1.55 system-ui";
  panel.innerHTML = '<form style="display:grid;gap:12px;margin:0"><strong id="stock-confirm-title">交易提醒</strong>' +
    '<label>反馈 <select name="verb"></select></label>' +
    '<div id="stock-fill" style="display:grid;gap:10px"><label>实际成交日期 <input name="date" type="date"></label>' +
    '<label>实际成交价 <input name="price" inputmode="decimal" type="number" min="0.000001" step="any" placeholder="元 / 股"></label>' +
    '<label>成交股数 <input name="quantity" inputmode="numeric" type="number" min="1" step="1" placeholder="选填"></label></div>' +
    '<button type="submit">确认</button><output role="status" aria-live="polite"></output>' +
    '<button type="button" name="closePanel">关闭</button></form>';
  document.body.appendChild(panel);
  const form = panel.querySelector("form");
  const fields = form.elements;
  const select = fields.namedItem("verb");
  const date = fields.namedItem("date"), price = fields.namedItem("price"), quantity = fields.namedItem("quantity");
  const button = form.querySelector('button[type="submit"]'), message = form.querySelector("output");
  if (/^[0-9]{6}$/.test(code)) panel.querySelector("strong").textContent += " · " + code;
  for (const element of form.querySelectorAll("button,select,input"))
    element.style.cssText = "box-sizing:border-box;font:inherit;min-height:44px;padding:4px 9px;max-width:100%";
  select.add(new Option("我看到了，暂未成交", "SEEN"));
  for (const v of verbs) select.add(new Option(labels[v], v));
  if (verbs.includes(initial)) select.value = initial;
  date.value = date.max = today;
  const sent = new Set();
  function refresh() {
    const v = select.value;
    panel.querySelector("#stock-fill").style.display = v === "SEEN" ? "none" : "grid";
    date.required = v !== "SEEN";
    date.disabled = price.disabled = quantity.disabled = v === "SEEN";
    price.required = v === "BOUGHT";
    button.disabled = sent.has(v);
    button.textContent = v === "SEEN" ? "我看到了，停止催促" : "确认" + labels[v];
  }
  select.onchange = () => { message.textContent = ""; refresh(); };
  form.onsubmit = async e => {
    e.preventDefault();
    const v = select.value;
    if (sent.has(v) || button.disabled) return;
    button.disabled = select.disabled = true;
    const plain = v === "SEEN" ? ["V2",id,v] : ["V2",id,v,price.value,date.value,quantity.value];
    message.textContent = "正在提交…";
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
      const decode = s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/") + "=".repeat((4-s.length%4)%4)), c=>c.charCodeAt(0));
      const encode = a => btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
      const key = await crypto.subtle.importKey("raw", decode(replykey), "AES-GCM", false, ["encrypt"]);
      const nonce = crypto.getRandomValues(new Uint8Array(12));
      const sealed = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:nonce,
        additionalData:new TextEncoder().encode("stock-feedback-v2")}, key, new TextEncoder().encode(plain.join("|"))));
      const body = "E2|" + encode(nonce) + "|" + encode(sealed);
      const resp = await fetch(feedback + "/" + encodeURIComponent(topic), {method:"POST",
        headers:{"Content-Type":"text/plain;charset=UTF-8"}, body,
        credentials:"omit", referrerPolicy:"no-referrer", mode:"no-cors", signal:controller.signal});
      if (!resp.ok && resp.type !== "opaque") throw Error();
      sent.add(v);
      message.textContent = "已提交。电脑处理后会向手机发回执。";
    } catch (_) { message.textContent = "提交未确认，请重试。同一笔只会记一次。"; }
    finally { clearTimeout(timeout); select.disabled = false; refresh(); }
  };
  fields.namedItem("closePanel").onclick = () => {
    panel.remove();
    history.replaceState(null, "", location.pathname + location.search);
  };
  refresh();
  if (typeof panel.showModal === "function") panel.showModal();
  else {
    panel.style.cssText += ";display:block;position:fixed;inset:5vh 0 auto;margin:auto;z-index:99999;overflow:auto";
    panel.setAttribute("open","");
  }
})();
</script>
